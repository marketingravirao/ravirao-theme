<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" xmlns:c2pa="http://c2pa.org/manifest">
<title>Vaastu compass overlay (animated, layered)</title>
<style>.rt,.rc,.pg,.nd{transform-origin:250px 250px}
.rt{animation:spin 90s linear infinite}
.rc{animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pg{animation:ping 4.5s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.36);opacity:0}}
.nd{animation:spin 16s linear infinite}
.lb{opacity:.6;animation:lbl 16s ease-in-out infinite}
.lbn{animation:lbn 16s ease-in-out infinite}
@keyframes lbl{0%,10%,100%{opacity:.6;fill:#fff}5%{opacity:1;fill:#ffb2a7}}
@keyframes lbn{0%,10%,100%{opacity:.75}5%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="sweepGrad" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="150" y2="0"><stop offset="0" stop-color="#e45b47" stop-opacity=".55"/><stop offset="1" stop-color="#e45b47" stop-opacity="0"/></linearGradient></defs>
<!-- LAYER 1 - static rings -->
<g id="layer-rings" fill="none" stroke="#fff"><circle cx="250" cy="250" r="244" stroke-opacity=".6"/><circle cx="250" cy="250" r="224" stroke-opacity=".3"/><circle cx="250" cy="250" r="180" stroke-width="1.6" stroke-opacity=".9"/></g>
<!-- LAYER 2 - tick scale, rotates clockwise, 90s -->
<g id="layer-ticks" class="rt"><path d="M250.0 26.0L250.0 6.0M272.7 19.1L273.9 7.2M295.3 22.5L297.6 10.7M317.3 28.0L320.8 16.5M335.7 43.1L343.4 24.6M359.4 45.4L365.0 34.8M378.9 57.1L385.6 47.1M397.2 70.7L404.8 61.4M408.4 91.6L422.5 77.5M429.3 102.8L438.6 95.2M442.9 121.1L452.9 114.4M454.6 140.6L465.2 135.0M456.9 164.3L475.4 156.6M472.0 182.7L483.5 179.2M477.5 204.7L489.3 202.4M480.9 227.3L492.8 226.1M474.0 250.0L494.0 250.0M480.9 272.7L492.8 273.9M477.5 295.3L489.3 297.6M472.0 317.3L483.5 320.8M456.9 335.7L475.4 343.4M454.6 359.4L465.2 365.0M442.9 378.9L452.9 385.6M429.3 397.2L438.6 404.8M408.4 408.4L422.5 422.5M397.2 429.3L404.8 438.6M378.9 442.9L385.6 452.9M359.4 454.6L365.0 465.2M335.7 456.9L343.4 475.4M317.3 472.0L320.8 483.5M295.3 477.5L297.6 489.3M272.7 480.9L273.9 492.8M250.0 474.0L250.0 494.0M227.3 480.9L226.1 492.8M204.7 477.5L202.4 489.3M182.7 472.0L179.2 483.5M164.3 456.9L156.6 475.4M140.6 454.6L135.0 465.2M121.1 442.9L114.4 452.9M102.8 429.3L95.2 438.6M91.6 408.4L77.5 422.5M70.7 397.2L61.4 404.8M57.1 378.9L47.1 385.6M45.4 359.4L34.8 365.0M43.1 335.7L24.6 343.4M28.0 317.3L16.5 320.8M22.5 295.3L10.7 297.6M19.1 272.7L7.2 273.9M26.0 250.0L6.0 250.0M19.1 227.3L7.2 226.1M22.5 204.7L10.7 202.4M28.0 182.7L16.5 179.2M43.1 164.3L24.6 156.6M45.4 140.6L34.8 135.0M57.1 121.1L47.1 114.4M70.7 102.8L61.4 95.2M91.6 91.6L77.5 77.5M102.8 70.7L95.2 61.4M121.1 57.1L114.4 47.1M140.6 45.4L135.0 34.8M164.3 43.1L156.6 24.6M182.7 28.0L179.2 16.5M204.7 22.5L202.4 10.7M227.3 19.1L226.1 7.2" fill="none" stroke="#fff" stroke-opacity=".6"/></g>
<!-- LAYER 3 - dotted ring, rotates clockwise, 140s -->
<circle id="layer-dotted-ring" class="rc" cx="250" cy="250" r="212" fill="none" stroke="#fff" stroke-opacity=".5" stroke-dasharray="2 9"/>
<!-- LAYER 4 - ping wave -->
<circle id="layer-ping" class="pg" cx="250" cy="250" r="180" fill="none" stroke="#fff" stroke-width="1.5"/>
<!-- LAYER 5 - 16 direction spokes -->
<path id="layer-spokes" d="M250.0 68.0L250.0 30.0M319.6 81.9L334.2 46.7M378.7 121.3L405.6 94.4M418.1 180.4L453.3 165.8M432.0 250.0L470.0 250.0M418.1 319.6L453.3 334.2M378.7 378.7L405.6 405.6M319.6 418.1L334.2 453.3M250.0 432.0L250.0 470.0M180.4 418.1L165.8 453.3M121.3 378.7L94.4 405.6M81.9 319.6L46.7 334.2M68.0 250.0L30.0 250.0M81.9 180.4L46.7 165.8M121.3 121.3L94.4 94.4M180.4 81.9L165.8 46.7" fill="none" stroke="#fff" stroke-opacity=".4"/>
<!-- LAYER 6 - north marker -->
<path id="layer-north-marker" d="M250 2L240 24L260 24Z" fill="#e45b47"/>
<!-- LAYER 7 - direction labels, lit one by one in sync with the needle -->
<g id="layer-labels" font-family="DM Sans,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><text class="lbn" style="animation-delay:-.8s" x="250.0" y="47.0" fill="#ff8a78">N</text><text class="lb" style="animation-delay:1.2s" x="393.5" y="106.5" fill="#fff">NE</text><text class="lb" style="animation-delay:3.2s" x="453.0" y="250.0" fill="#fff">E</text><text class="lb" style="animation-delay:5.2s" x="393.5" y="393.5" fill="#fff">SE</text><text class="lb" style="animation-delay:7.2s" x="250.0" y="453.0" fill="#fff">S</text><text class="lb" style="animation-delay:9.2s" x="106.5" y="393.5" fill="#fff">SW</text><text class="lb" style="animation-delay:11.2s" x="47.0" y="250.0" fill="#fff">W</text><text class="lb" style="animation-delay:13.2s" x="106.5" y="106.5" fill="#fff">NW</text></g>
<!-- LAYER 8 - radar sweep + needle, clockwise, 16s per turn -->
<g id="layer-needle" class="nd"><path d="M250 250L250 100A150 150 0 0 0 153.6 135.1Z" fill="url(#sweepGrad)"/><path d="M250 100L258 250L250 262L242 250Z" fill="#e45b47"/><path d="M250 400L258 250L250 238L242 250Z" fill="#fff" fill-opacity=".85"/></g>
<!-- LAYER 9 - hub -->
<g id="layer-hub"><circle cx="250" cy="250" r="7" fill="#fff"/><circle cx="250" cy="250" r="3" fill="#e45b47"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
